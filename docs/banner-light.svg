<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="title desc">
  <title id="title">AMBIT</title>
  <desc id="desc">Passive radio-environment observer for Android</desc>
  <defs>
    <radialGradient id="glow" cx="320" cy="200" r="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0E8FA0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0E8FA0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0E8FA0" stop-opacity="0"/>
      <stop offset="1" stop-color="#0E8FA0" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#D5E3E8" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="400" fill="#F3F7F9"/>
  <rect width="1280" height="400" fill="url(#grid)" opacity="0.55"/>
  <circle cx="320" cy="200" r="220" fill="url(#glow)"/>

  <!-- range rings -->
  <g fill="none" stroke="#5FB3BF" stroke-width="1.5">
    <circle cx="320" cy="200" r="50"/>
    <circle cx="320" cy="200" r="100"/>
    <circle cx="320" cy="200" r="150" stroke-dasharray="4 6"/>
  </g>
  <g stroke="#D5E3E8" stroke-width="1">
    <line x1="160" y1="200" x2="480" y2="200"/>
    <line x1="320" y1="40" x2="320" y2="360"/>
  </g>

  <!-- sweep wedge -->
  <path d="M320 200 L470 200 A150 150 0 0 0 426 94 Z" fill="url(#sweep)">
    <animateTransform attributeName="transform" type="rotate" from="0 320 200" to="-360 320 200" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- contacts: Wi-Fi circles, BLE squares, one flagged tracker -->
  <g fill="#0E8FA0">
    <circle cx="372" cy="152" r="5"/>
    <circle cx="246" cy="236" r="5"/>
    <circle cx="410" cy="262" r="4"/>
    <rect x="268" y="128" width="8" height="8"/>
    <rect x="352" y="298" width="8" height="8" fill="#3B6FD1"/>
    <rect x="214" y="178" width="8" height="8" fill="#3B6FD1"/>
  </g>
  <g>
    <rect x="296" y="254" width="10" height="10" fill="#D98A00"/>
    <circle cx="301" cy="259" r="14" fill="none" stroke="#D98A00" stroke-width="1.5">
      <animate attributeName="r" values="10;20;10" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="320" cy="200" r="4" fill="#0B1A20"/>

  <!-- wordmark -->
  <g font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace">
    <text x="600" y="190" fill="#0B1A20" font-size="104" font-weight="700" letter-spacing="18">AMBIT</text>
    <text x="604" y="236" fill="#4A6670" font-size="22" letter-spacing="2">passive radio-environment observer</text>
    <text x="604" y="290" fill="#0E8FA0" font-size="16" letter-spacing="3">WI-FI · BLE · TRACKER CORRELATION · 100% ON-DEVICE</text>
  </g>
</svg>
