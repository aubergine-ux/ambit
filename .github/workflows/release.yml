name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The keystore lives only in repository secrets, base64-encoded.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.AMBIT_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build
        env:
          AMBIT_STORE_FILE: ${{ runner.temp }}/release.jks
          AMBIT_STORE_PASSWORD: ${{ secrets.AMBIT_STORE_PASSWORD }}
          AMBIT_KEY_ALIAS: ${{ secrets.AMBIT_KEY_ALIAS }}
          AMBIT_KEY_PASSWORD: ${{ secrets.AMBIT_KEY_PASSWORD }}
        run: ./gradlew test assembleRelease --console=plain

      - name: Name the APK and checksum it
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/app-release.apk "ambit-$version.apk"
          sha256sum "ambit-$version.apk" > "ambit-$version.apk.sha256"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)
          notes="fastlane/metadata/android/en-US/changelogs/$code.txt"
          gh release create "$GITHUB_REF_NAME" "ambit-$version.apk" "ambit-$version.apk.sha256" \
            --title "Ambit $version" \
            --notes-file "$notes"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
